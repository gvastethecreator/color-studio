<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OKLCH palette generator with curated presets, CSS / Tailwind 4 / JSON token export, and a live dashboard preview."
    />
    <meta name="theme-color" content="#060606" />
    <title>Color Studio</title>
    <script>
      // Lock dark mode as the default and prevent layout flicker on first paint.
      try {
        localStorage.setItem('color-studio.theme', 'dark');
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } catch (_error) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
