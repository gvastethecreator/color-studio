<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A local-first color workbench for harmonious palettes, CSS gradients, OKLCH token scales, contrast testing, and color mixing."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#060606" />
    <title>Color Studio</title>
    <script>
      // Apply the saved theme before React mounts to prevent a first-paint flash.
      try {
        const settings = JSON.parse(localStorage.getItem('color-studio.settings') || '{}');
        const theme = settings.theme === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#12110F' : '#E9E5DC');
      } catch (_error) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
